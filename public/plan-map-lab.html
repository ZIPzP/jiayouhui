<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>家游汇 · 行程地图工作台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>" />
  <style>
    :root {
      --green: #0f766e;
      --green-soft: #ecfdf5;
      --orange: #f97316;
      --ink: #1f2937;
      --muted: #64748b;
      --line: #e7e5e4;
      --bg: #f6f4ef;
      --card: #fff;
      --shadow: 0 10px 28px rgba(31, 41, 55, .08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
    }
    button, select { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 900; color: var(--green); font-size: 18px; }
    .brand-mark { width: 32px; height: 32px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 16px; }
    .badge { font-size: 11px; font-weight: 800; color: #9a3412; background: #ffedd5; border: 1px solid #fed7aa; padding: 5px 9px; border-radius: 999px; }
    .spacer { flex: 1; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .top-actions button, .top-actions a {
      height: 36px; display: inline-flex; align-items: center; justify-content: center;
      padding: 0 13px; border-radius: 9px; border: 1.5px solid var(--line);
      background: #fff; color: var(--muted); font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .top-actions button:hover, .top-actions a:hover { background: var(--green-soft); color: var(--green); border-color: #a7f3d0; }
    .top-actions .primary { background: var(--green); border-color: var(--green); color: #fff; }
    .top-actions .primary:hover { background: #115e59; color: #fff; }
    .workspace {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 280px;
      gap: 12px;
      height: calc(100vh - 64px);
      min-height: 0;
    }
    .editor {
      position: static;
      width: auto;
      max-width: none;
      height: calc(100% - 24px);
      margin: 12px 0 12px 12px;
      overflow-y: auto;
      padding: 18px;
      background: rgba(250, 249, 246, .95);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, .18);
      backdrop-filter: blur(14px);
      min-height: 0;
      overscroll-behavior: contain;
    }
    .editor-head h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: -.02em; }
    .editor-head p { margin: 0 0 16px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .data-status { display: inline-block; padding: 4px 8px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-size: 11px; font-weight: 800; }
    .day-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .day-head {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, color-mix(in srgb, var(--c) 9%, white), #fff);
    }
    .day-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
    .day-title { font-size: 14px; font-weight: 900; }
    .day-zone { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 700; }
    .day-body { padding: 8px 10px 10px; }
    .stop-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 6px;
      align-items: start;
      padding: 8px 4px;
      border-bottom: 1px dashed #f1f5f9;
      cursor: pointer;
    }
    .stop-row:last-child { border-bottom: none; }
    .stop-row:hover { background: #f8fafc; }
    .stop-row.active { background: var(--green-soft); border-radius: 8px; }
    .stop-index {
      grid-column: 1;
      grid-row: 1;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--c); color: #fff; display: grid; place-items: center;
      font-size: 11px; font-weight: 900;
    }
    .stop-main { grid-column: 2; grid-row: 1; min-width: 0; }
    .stop-main b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stop-main small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .stop-actions { grid-column: 2; grid-row: 2; display: flex; align-items: center; gap: 3px; justify-self: start; cursor: default; }
    .stop-actions button {
      width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--line);
      background: #fff; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0;
    }
    .stop-actions button:hover { background: var(--green-soft); color: var(--green); }
    .stop-actions button.danger:hover { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
    .stop-actions select {
      height: 22px; max-width: 44px; border: 1px solid var(--line); border-radius: 7px;
      background: #fff; color: var(--muted); font-size: 9px; padding: 0 2px;
    }
    .pool-card { background: #fff; border: 1px dashed #cbd5e1; border-radius: 16px; padding: 12px 14px; }
    .pool-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .pool-head h2 { margin: 0; font-size: 13px; font-weight: 900; }
    .pool-head select { margin-left: auto; height: 28px; border: 1px solid var(--line); border-radius: 8px; font-size: 11px; color: var(--muted); background: #fff; }
    .pool-note { margin: 0 0 8px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    #poolList { max-height: 260px; overflow-y: auto; }
    .pool-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px dashed #f1f5f9; font-size: 12px; }
    .pool-row:first-of-type { border-top: none; }
    .pool-row span { flex: 1; min-width: 0; line-height: 1.35; }
    .pool-row span small { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }
    .hot-badge { display: inline-block; margin-left: 4px; padding: 1px 5px; border-radius: 999px; background: #fff7ed; border: 1px solid #fed7aa; color: #c2410c; font-size: 9px; font-style: normal; font-weight: 800; }
    .pool-row button { height: 26px; padding: 0 9px; border-radius: 7px; border: 1px solid #a7f3d0; background: var(--green-soft); color: var(--green); font-size: 10px; font-weight: 800; cursor: pointer; }
    .pool-row > input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--green); flex: none; cursor: pointer; }
    .pool-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #f1f5f9; }
    .pool-actions button { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--green); background: var(--green); color: #fff; font-size: 11px; font-weight: 800; cursor: pointer; }
    .pool-actions button:disabled { background: #f1f5f9; border-color: var(--line); color: #94a3b8; cursor: default; }
    .pool-actions span { color: var(--muted); font-size: 10px; }
    .map-stage { position: relative; inset: auto; height: calc(100% - 24px); margin: 12px 0; min-width: 0; min-height: 0; background: #e8eef0; border-radius: 18px; overflow: hidden; }
    .info-panel {
      height: calc(100% - 24px);
      margin: 12px 12px 12px 0;
      padding: 16px;
      overflow-y: auto;
      background: rgba(255, 255, 255, .96);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      min-height: 0;
      overscroll-behavior: contain;
    }
    .info-tabs { display: flex; gap: 4px; padding: 4px; margin-bottom: 14px; border-radius: 11px; background: #f1f5f9; }
    .info-tabs button { flex: 1; padding: 7px 4px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 800; cursor: pointer; }
    .info-tabs button.active { background: #fff; color: var(--green); box-shadow: 0 2px 8px rgba(15, 23, 42, .08); }
    .info-section-title { margin: 0 0 8px; font-size: 12px; font-weight: 900; color: var(--ink); }
    .info-note { margin: 0 0 12px; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .train-row { padding: 9px 0; border-top: 1px dashed #f1f5f9; }
    .train-row:first-of-type { border-top: none; }
    .train-row b { font-size: 13px; }
    .train-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .train-price { margin-top: 3px; color: #b45309; font-size: 11px; font-weight: 700; }
    .info-list { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .info-kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #f1f5f9; font-size: 12px; }
    .info-kv:last-child { border-bottom: 0; }
    .info-kv span { color: var(--muted); }
    .info-kv b { text-align: right; }
    .weather-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px dashed #f1f5f9; font-size: 12px; }
    .weather-row:last-child { border-bottom: 0; }
    .weather-row span { color: var(--muted); }
    .hotel-current { margin: 0 0 10px; padding: 9px 10px; border-radius: 10px; background: var(--green-soft); color: var(--green); font-size: 12px; line-height: 1.6; }
    .hotel-search { display: flex; gap: 6px; margin-bottom: 10px; }
    .hotel-search input { flex: 1; min-width: 0; height: 34px; border: 1.5px solid var(--line); border-radius: 9px; padding: 0 9px; font: inherit; font-size: 11px; color: var(--ink); background: #fbfaf7; }
    .hotel-search input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(15, 118, 110, .12); background: #fff; }
    .hotel-search button { height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--green); background: var(--green); color: #fff; font-size: 11px; font-weight: 800; cursor: pointer; }
    .hotel-row { padding: 9px 0; border-top: 1px dashed #f1f5f9; }
    .hotel-row:first-child { border-top: 0; }
    .hotel-row b { display: block; font-size: 12px; }
    .hotel-row small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .hotel-row button { margin-top: 6px; height: 26px; padding: 0 9px; border-radius: 7px; border: 1px solid #a7f3d0; background: var(--green-soft); color: var(--green); font-size: 10px; font-weight: 800; cursor: pointer; }
    #mapCanvas { width: 100%; height: 100%; }
    .map-overlay {
      position: absolute; top: 16px; right: 16px; left: auto; z-index: 5;
      background: rgba(255,255,255,.94); backdrop-filter: blur(8px);
      border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px;
      box-shadow: var(--shadow); max-width: 280px;
    }
    .map-overlay b { display: block; font-size: 13px; }
    .map-overlay span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .map-tip { display: block; margin-top: 6px; color: #9a3412; font-size: 10px; line-height: 1.5; }
    .legend {
      position: absolute; bottom: 16px; right: 16px; left: auto; z-index: 5;
      display: flex; flex-wrap: wrap; gap: 8px 12px;
      background: rgba(255,255,255,.94); border: 1px solid var(--line);
      border-radius: 11px; padding: 9px 12px; box-shadow: var(--shadow);
      font-size: 11px; color: var(--muted); font-weight: 700;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
    .map-pin {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--c); color: #fff; border: 3px solid #fff;
      display: grid; place-items: center; font-size: 11px; font-weight: 900;
      box-shadow: 0 3px 10px rgba(15,23,42,.28);
    }
    .map-hotel {
      width: 34px; height: 34px; border-radius: 10px; background: #fff;
      border: 2px solid var(--green); display: grid; place-items: center;
      font-size: 16px; box-shadow: 0 3px 10px rgba(15,23,42,.2);
    }
    .amap-marker-label { border: 0 !important; background: transparent !important; padding: 0 !important; }
    .map-label {
      display: inline-block; margin-bottom: 5px; padding: 2px 6px;
      border-radius: 5px; background: rgba(255,255,255,.92); border: 1px solid #e2e8f0;
      color: #334155; font-size: 10px; font-weight: 800; white-space: nowrap;
      box-shadow: 0 1px 4px rgba(15,23,42,.08);
    }
    .map-fallback {
      position: absolute; inset: 0; display: grid; place-items: center;
      padding: 30px; text-align: center; color: var(--muted); font-size: 13px;
      background: linear-gradient(160deg, #f8fafc, #eef6f3);
    }
    .mobile-note {
      display: none; min-height: 100vh; place-items: center; padding: 24px;
      text-align: center; color: var(--muted); line-height: 1.8; background: var(--bg);
    }
    .mobile-note a { color: var(--green); font-weight: 800; }
    @media (max-width: 1200px) {
      .workspace { grid-template-columns: 280px minmax(0, 1fr) 260px; }
    }
    @media (max-width: 1050px) {
      .workspace { grid-template-columns: 280px minmax(0, 1fr); }
      .info-panel { display: none; }
    }
    @media (max-width: 900px) {
      .workspace { display: none; }
      .mobile-note { display: grid; }
      .badge { display: none; }
      .top-actions { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/plan.html"><span class="brand-mark">🏡</span><span>家游汇</span></a>
    <span class="badge">行程地图工作台 · 电脑端测试</span>
    <span class="spacer"></span>
    <div class="top-actions">
      <button id="loadAiBtn" type="button">载入最近 AI 行程</button>
      <button id="optimizeBtn" type="button">重新优化路线</button>
      <button id="resetBtn" type="button">重置示例</button>
      <a class="primary" href="/plan.html">关闭工作台</a>
    </div>
  </header>

  <main class="workspace">
    <aside class="editor">
      <div class="editor-head">
        <h1>北京 · 4 天家庭行程</h1>
        <p>上下移动、换天、删除或添加景点，右侧地图会同步变化。示例数据用于验证交互，正式版可接 AI 生成的行程。</p>
        <span class="data-status" id="dataStatus">示例行程</span>
      </div>
      <div id="dayList"></div>
      <section class="pool-card">
        <div class="pool-head">
          <h2>🔥 近期热门备选</h2>
          <select id="addDay" aria-label="添加到哪一天"></select>
        </div>
        <p class="pool-note">按近期热度排序 · 每 2 个月更新（2026-09）</p>
        <div id="poolList"></div>
        <div class="pool-actions">
          <button id="addSelected" type="button" disabled>加入所选</button>
          <span id="poolSelectedCount">已选 0 个</span>
        </div>
      </section>
    </aside>

    <section class="map-stage">
      <div id="mapCanvas"></div>
      <div class="map-overlay">
        <b>北京行程地图</b>
        <span id="mapStatus">正在加载高德地图…</span>
        <small class="map-tip">本地测试如底图空白或路线是直线：在高德控制台把 localhost 加入这个 Key 的域名白名单。</small>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="info-panel">
      <div class="info-tabs" id="infoTabs">
        <button type="button" class="active" data-tab="transport">交通</button>
        <button type="button" data-tab="hotel">酒店</button>
        <button type="button" data-tab="budget">预算</button>
        <button type="button" data-tab="weather">天气</button>
        <button type="button" data-tab="tips">建议</button>
      </div>
      <div id="infoBody"></div>
    </aside>
  </main>

  <div class="mobile-note">
    <div>这个地图工作台只在电脑端打开。<br />手机端请继续使用行程规划页的上下布局。<br /><a href="/plan.html">返回行程规划</a></div>
  </div>

  <script src="/js/plan-map-lab.js?v=20261101g" defer></script>
</body>
</html>
