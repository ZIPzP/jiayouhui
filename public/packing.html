  <div class="nav-backdrop" id="navBackdrop"></div>  <section id="packing" class="section section-alt">
    <div class="section-head" data-reveal>
      <h2>🎒 出行打包清单</h2>
      <p>选择目的地与出行时段，AI 为你和家人量身推荐该带的旅行用品</p>
    </div>
    <div class="packing-layout">
      <div class="card form-card" data-reveal>
        <div class="form-group">
          <label class="form-label" for="pf-dest">目的地</label>
          <input id="pf-dest" class="input" placeholder="如 杭州/拉萨" />
        </div>
        <div class="form-group">
          <label class="form-label" for="pf-month">出行月份（AI 据此判断季节与天气）</label>
          <select id="pf-month" class="input"></select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="pf-duration">出行天数</label>
            <select id="pf-duration" class="input">
              <option value="2">2 天</option><option value="3" selected>3 天</option>
              <option value="4">4 天</option><option value="5">5 天</option><option value="7">7 天</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">同行人数</label>
            <div class="num-group">
              <span>👴<input id="pf-elderly" type="number" min="0" max="9" value="2" class="input num" /></span>
              <span>🧑<input id="pf-adults" type="number" min="0" max="9" value="2" class="input num" /></span>
              <span>🧒<input id="pf-children" type="number" min="0" max="9" value="1" class="input num" /></span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">兴趣偏好（可多选）</label>
          <div class="chip-group" id="interestChips">
            <label><input type="checkbox" value="自然风光" /> 自然风光</label>
            <label><input type="checkbox" value="美食" /> 美食</label>
            <label><input type="checkbox" value="博物馆" /> 博物馆</label>
            <label><input type="checkbox" value="海滨玩水" /> 海滨玩水</label>
            <label><input type="checkbox" value="古城老街" /> 古城老街</label>
          </div>
        <div class="form-group">
          <label class="form-label" for="pf-mode">详细程度</label>
          <select id="pf-mode" class="input">
            <option value="简略" selected>📦 简略（精选必备）</option>
            <option value="超详细">🧳 超详细（懒人攻略：防晒会补清洁乳、湿巾配纸巾…）</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="pf-notes">用户要求（可选，会结合需求生成）</label>
          <textarea id="pf-notes" class="input" rows="2" placeholder="如：带老人要多带膏药；给孩子多带零食；我要拍照带三脚架……"></textarea>
        </div>
        </div>
        <button id="pf-submit" class="btn btn-primary btn-lg btn-block" type="button">🐱 生成打包清单</button>
        <p class="form-hint" id="aiModeHint"></p>
      </div>
      <div class="card result-card">
        <div class="result-empty" id="resultEmpty">
          <div class="result-empty-icon">🎒</div>
          <p>点击「生成打包清单」<br />AI 会根据出行时段、目的地和同行人给出建议</p>
        </div>
        <div id="resultBody" hidden></div>
      </div>
    </div>
