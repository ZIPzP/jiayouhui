# 测试环境 Nginx 反向代理（端口 8080 -> 127.0.0.1:3001）
# 用途：上线前在真实服务器上验证 dev-test-opt 分支，不影响 production（80/443 -> 3000）。
# 放置到 /etc/nginx/conf.d/jiayouhui-test.conf 后：nginx -t && systemctl reload nginx
# 访问方式：http://<服务器公网IP>:8080  （需在阿里云安全组放行 8080）
# 验证完成后可 systemctl reload nginx 前先 mv 掉本文件，测试环境随即关闭对外入口。
server {
    listen 8080;
    server_name _;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 300s;
    }
}
