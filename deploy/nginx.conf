# 阿里云服务器 Nginx 反向代理（familytravelhublz.top，已备案）
# 放置到 /etc/nginx/conf.d/jiayouhui.conf 后：nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name familytravelhublz.top www.familytravelhublz.top;

    # 如需启用 gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
# HTTPS（DNS 解析到阿里云服务器并生效后执行，自动签发证书 + 80→443 跳转）：
#   apt install -y certbot python3-certbot-nginx
#   certbot --nginx -d familytravelhublz.top -d www.familytravelhublz.top
