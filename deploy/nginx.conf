# 阿里云服务器 Nginx 反向代理（familytravelhublz.top，已备案）
# 放置到 /etc/nginx/conf.d/jiayouhui.conf 后：nginx -t && systemctl reload nginx
# 注意：deploy/server-setup.sh 会把 __DOMAIN__ 替换成实际域名，改域名请改这一处占位符。
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # 如需启用 gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 应用侧按字节限制 512KB；这里略放宽，避免中文请求体在 nginx 就被 413（返回 HTML 会让前端 JSON 解析失败）
    client_max_body_size 2m;

    # 应用层已有按 IP 限流，这里再加一道粗粒度保护，防止绕过 Node 直接打穿
    limit_req_zone $binary_remote_addr zone=jiayouhui:10m rate=30r/s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=jiayouhui burst=60 nodelay;

        # 一次行程生成 = 2 次 12306 + 1 次大模型（AI 超时 120s），若读超时等于 AI 超时，
        # 慢请求会先被 nginx 判 504，而 Node 侧任务仍在继续跑，用户重试即重复计费。
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 300s;
    }

    location = /api/chat/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
# HTTPS（DNS 解析到阿里云服务器并生效后执行，自动签发证书 + 80→443 跳转）：
#   apt install -y certbot python3-certbot-nginx
#   certbot --nginx -d familytravelhublz.top -d www.familytravelhublz.top
