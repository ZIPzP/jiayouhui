# GitHub Actions：推送到 main 分支后自动部署到阿里云服务器
# 使用前请在 GitHub 仓库 Settings -> Secrets 添加：
#   SSH_HOST    服务器公网 IP
#   SSH_USER    服务器用户名（如 root）
#   SSH_KEY    服务器私钥内容（部署用账号的 ~/.ssh/id_ed25519）
name: Deploy to Aliyun ECS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin
            cd /opt/jiayouhui
            git pull origin main
            pm2 restart jiayouhui || pm2 start ecosystem.config.js